[project]
name = "gym-backend"
version = "0.1.0"
description = "Production-ready Gym Management System backend (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.9.0",
    "argon2-cffi>=23.1.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "boto3>=1.35.0",
    "Pillow>=11.0.0",
    "websockets>=13.1",
    "python-slugify>=8.0.4",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
    "faker>=30.8.0",
]

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The DB-backed test fixtures (tests/db_fixtures.py) create the async
# SQLAlchemy engine ONCE at module scope, so it must live on the same event
# loop for the whole test session. pytest-asyncio's default is a fresh loop
# per test function, which orphans the engine's pooled asyncpg connections
# after the first test (surfaces as "Event loop is closed" / low-level
# asyncio Proactor errors on the second DB test onward, especially on
# Windows). Session-scoped loop fixes it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
